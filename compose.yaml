services:
  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD securely}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [application]

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      DJANGO_DEBUG: "0"
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Supply a unique production secret key securely}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?Set your real hostname}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:?Set your HTTPS origin}
      DJANGO_TRUST_PROXY: "1"
      POSTGRES_HOST: database
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD securely}
      POSTGRES_SSLMODE: disable
    volumes:
      - private-media:/var/lib/uniflow/media
      - django-static:/var/lib/uniflow/static
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "/app/deploy/healthcheck.py"]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 5
    networks: [application]

  frontend:
    build:
      context: .
      target: frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - django-static:/var/lib/uniflow/static:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [application]

volumes:
  database-data:
  private-media:
  django-static:

networks:
  application:
    driver: bridge
