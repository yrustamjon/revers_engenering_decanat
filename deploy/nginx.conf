# This listener is only published on host loopback, behind a trusted HTTPS edge.
# See docs/DEPLOYMENT.md before changing ports or proxy trust.
server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 21m;
    # Docker's DNS is re-resolved after backend container replacement.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream backend:8000;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        # HTTPS is terminated by the trusted edge before this loopback listener.
        # Overwrite, rather than trust, any client-supplied forwarded scheme.
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 95s;
        proxy_redirect off;
        proxy_cache off;
    }

    location /admin/ {
        proxy_pass http://$backend_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 95s;
        proxy_redirect off;
        proxy_cache off;
    }

    location /static/ {
        alias /var/lib/uniflow/static/;
        autoindex off;
        expires 1d;
    }

    # Files are private. All downloads must pass authenticated API authorization.
    location /media/ { return 404; }
    location ~ /\. { deny all; }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
    }

    location / { try_files $uri $uri/ /index.html; }
}
