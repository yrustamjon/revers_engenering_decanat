name: UniFlow checks
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Backend and bot tests
        run: |
          python backend/manage.py test core --verbosity 2
          python backend/manage.py makemigrations --check --dry-run
          python -m unittest discover -s integrations/tests -v
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start test application
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py seed_demo
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/uniflow-api.log 2>&1 &
          npm run dev --prefix frontend > /tmp/uniflow-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null && [ "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/session/)" = 401 ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uniflow-api.log /tmp/uniflow-web.log
          exit 1
      - name: Browser workflow tests
        run: npm run test:e2e --prefix frontend
      - name: Save browser results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results
          path: frontend/test-results
