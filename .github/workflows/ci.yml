name: UniFlow checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uniflow-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UNIFLOW_E2E: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Backend and bot tests
        run: |
          python backend/manage.py test core --verbosity 2
          python backend/manage.py makemigrations --check --dry-run
          python -m unittest discover -s integrations/tests -v
      - name: Frontend build
        run: npm run build --prefix frontend
      - name: Install test browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start test application
        run: |
          python backend/manage.py migrate --noinput
          python backend/manage.py runserver 127.0.0.1:8000 --noreload > /tmp/uniflow-api.log 2>&1 &
          npm run dev --prefix frontend > /tmp/uniflow-web.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/ >/dev/null && [ "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/auth/session/)" = 401 ]; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/uniflow-api.log /tmp/uniflow-web.log
          exit 1
      - name: Browser workflow tests
        run: npm run test:e2e --prefix frontend
      - name: Save browser results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-results
          path: frontend/test-results

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: uniflow_ci
          POSTGRES_USER: uniflow_ci
          POSTGRES_PASSWORD: disposable-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uniflow_ci -d uniflow_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: '5432'
      POSTGRES_DB: uniflow_ci
      POSTGRES_USER: uniflow_ci
      POSTGRES_PASSWORD: disposable-ci-only
      POSTGRES_SSLMODE: disable
      DJANGO_REDIS_URL: redis://127.0.0.1:6379/0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r backend/requirements.txt
      - name: PostgreSQL workflow and shared cache integration
        run: python backend/manage.py test core --verbosity 2

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install security tools
        run: |
          python -m venv .local/security-venv
          .local/security-venv/bin/pip install -r requirements-security.txt
      - name: SAST, dependency audits and secret scanning
        run: bash scripts/security-check.sh
      - name: Security reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-security-${{ github.sha }}
          path: artifacts/security
          retention-days: 14

  container:
    needs: [test, postgres, security]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build non-root application image
        run: |
          docker build -f Dockerfile.render --build-arg VCS_REF=${{ github.sha }} -t uniflow:${{ github.sha }} .
          test "$(docker image inspect --format '{{.Config.User}}' uniflow:${{ github.sha }})" = uniflow
          docker run --rm --entrypoint python uniflow:${{ github.sha }} -c "import django, rest_framework, psycopg, redis, whitenoise; print('Runtime imports OK')"
          mkdir -p .local/image artifacts/container
          docker save uniflow:${{ github.sha }} -o .local/image/app.tar
      - name: Production configuration and real authentication smoke check
        run: bash scripts/container-smoke.sh uniflow:${{ github.sha }}
      - name: Container vulnerability gate and SBOM
        run: |
          scanner=aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          docker run --rm -v "$PWD/.local/image:/scan:ro" -v "$PWD/artifacts/container:/reports" -v trivy-cache:/root/.cache/trivy "$scanner" image --db-repository ghcr.io/aquasecurity/trivy-db:2 --input /scan/app.tar --scanners vuln --format cyclonedx --output /reports/sbom.cdx.json
          docker run --rm -v "$PWD/.local/image:/scan:ro" -v "$PWD/artifacts/container:/reports" -v trivy-cache:/root/.cache/trivy "$scanner" image --db-repository ghcr.io/aquasecurity/trivy-db:2 --input /scan/app.tar --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format json --output /reports/vulnerabilities.json
      - name: Container reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-security-${{ github.sha }}
          path: artifacts/container
          retention-days: 14
      - name: Prepare release archive after all gates pass
        if: github.event_name == 'workflow_dispatch'
        run: |
          gzip -c .local/image/app.tar > artifacts/uniflow-${{ github.sha }}.tar.gz
          cd artifacts
          sha256sum uniflow-${{ github.sha }}.tar.gz > SHA256SUMS
      - name: Reviewable release artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: uniflow-release-${{ github.sha }}
          path: |
            artifacts/uniflow-*.tar.gz
            artifacts/SHA256SUMS
          retention-days: 7
